plugins { id 'com.android.application' }
android {
    namespace 'com.sadique.launcher.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sadique.launcher.mobile'
        minSdk 28
        targetSdk 36
        versionCode 9
        versionName '7.0'
        testInstrumentationRunner 'com.sadique.launcher.mobile.PanelRoutingInstrumentation'
    }
    signingConfigs {
        mobileRelease {
            if(System.getenv('MOBILE_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MOBILE_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('MOBILE_KEYSTORE_PASSWORD')
                keyAlias 'personal-mobile'
                keyPassword System.getenv('MOBILE_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig System.getenv('MOBILE_KEYSTORE_PATH') ? signingConfigs.mobileRelease : null; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
