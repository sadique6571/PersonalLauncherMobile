name: Mobile launcher checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Tests, lint and both APK variants
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Explain lint failures
        if: failure()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - name: Verify development APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload development APK and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PersonalLauncherMobile-dev-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14
  panel-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 16 panel return-path tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell input keyevent 82
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb pull /sdcard/Android/data/com.sadique.launcher.mobile/files/routing-shots app/build/routing-shots || true; exit 1; }
            adb pull /sdcard/Android/data/com.sadique.launcher.mobile/files/routing-shots app/build/routing-shots
      - name: Upload panel routing results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panel-routing-results-${{ github.run_number }}
          path: |
            app/build/routing-shots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, panel-routing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check release signing configuration
        id: signing
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MOBILE_KEYSTORE_BASE64" ] && [ -n "$MOBILE_KEYSTORE_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release key is not configured. See SIGNING.md; no production release will be published."
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        if: steps.signing.outputs.ready == 'true'
      - name: Restore private signing file
        if: steps.signing.outputs.ready == 'true'
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobile-release.p12"
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          MOBILE_KEYSTORE_PATH: ${{ runner.temp }}/mobile-release.p12
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PersonalLauncherMobile.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/PersonalLauncherMobile.apk"
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mobile-release.p12"
      - name: Publish signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-build-${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/PersonalLauncherMobile.apk" --target "$GITHUB_SHA" --title "Personal Launcher Mobile 7.0 - build ${GITHUB_RUN_NUMBER}" --notes "Signed mobile release. Requires the same release certificate for future updates. OriginOS device retesting is still required."
